<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Outer Glow & Shadow -->
    <radialGradient id="ambientGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ff1e42" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#7928ca" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Main Vibrant Brand Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1a40" />
      <stop offset="42%" stop-color="#f43f5e" />
      <stop offset="78%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Dark Titanium Metal Backplate Gradient -->
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2029" />
      <stop offset="50%" stop-color="#14151b" />
      <stop offset="100%" stop-color="#0b0c10" />
    </linearGradient>

    <!-- Inner Plate Rim Highlight -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.4" />
    </linearGradient>

    <!-- Play Glyph Specular Gradient -->
    <linearGradient id="playGlyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#f3f4f6" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Focus Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Filters for Depth -->
    <filter id="softShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="glyphGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#ffffff" flood-opacity="0.4" />
    </filter>

    <filter id="emeraldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10b981" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="256" cy="256" r="240" fill="url(#ambientGlow)" />

  <!-- Outer Rounded Squircle Base (Apple/Chrome Master Style) -->
  <rect x="40" y="40" width="432" height="432" rx="112" ry="112" fill="url(#plateGrad)" stroke="url(#rimGrad)" stroke-width="3" filter="url(#softShadow)" />

  <!-- Inner Concentric Dynamic Iris Rings (Mindfulness & Focus Waves) -->
  <circle cx="256" cy="256" r="172" fill="none" stroke="#2a2d3d" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6" />
  <circle cx="256" cy="256" r="148" fill="none" stroke="#373b50" stroke-width="1" opacity="0.4" />

  <!-- The "Refined" YouTube Shield / Screen Element -->
  <rect x="108" y="132" width="296" height="248" rx="64" ry="64" fill="url(#brandGrad)" filter="url(#softShadow)" />
  <rect x="109" y="133" width="294" height="246" rx="63" ry="63" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.3" />

  <!-- Diamond Cut Highlight on Screen Corner -->
  <path d="M128 160 C 128 140, 140 134, 170 134 L 342 134 C 280 180, 200 200, 128 160 Z" fill="#ffffff" opacity="0.16" />

  <!-- Centered Iconic Play Glyph (Crisp, High Precision, Rounded Vertices) -->
  <path d="M224 200 C 224 193.5, 231.2 189.5, 236.8 193.0 L 316.5 244.5 C 321.8 248.0, 321.8 256.0, 316.5 259.5 L 236.8 311.0 C 231.2 314.5, 224 310.5, 224 304.0 Z" 
        fill="url(#playGlyphGrad)" 
        filter="url(#glyphGlow)" />

  <!-- Mindful Focus & Zen Ring (Upper Right Node - Symbol of Shielding & Calm Clarity) -->
  <g transform="translate(376, 120)">
    <circle cx="0" cy="0" r="32" fill="#0c0d12" stroke="#ffffff" stroke-width="2" stroke-opacity="0.2" />
    <circle cx="0" cy="0" r="24" fill="url(#ringGrad)" filter="url(#emeraldGlow)" />
    <!-- Checkmark inside Shield Node -->
    <path d="M-8 0 L-2 6 L9 -5" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Anti-Distraction Sparkle Icon (Lower Left) -->
  <g transform="translate(136, 360)">
    <circle cx="0" cy="0" r="18" fill="#161822" stroke="url(#brandGrad)" stroke-width="2" />
    <path d="M0 -9 L2 -2 L9 0 L2 2 L0 9 L-2 2 L-9 0 L-2 -2 Z" fill="#ffffff" />
  </g>
</svg>
